name: builder-check

# Read-only health probe for a Hetzner builder, runnable on demand. This exists
# because the Claude Code web sandbox has no outbound SSH: a web session
# triggers this workflow and reads the logs to observe builder state (deployed
# revision, comin status, store health) without ever opening port 22 itself.

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: "Public IPv4 of the builder"
        required: true
  push:
    branches: [main]
    paths: ["checks/request.json"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target IP
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_ip=${{ inputs.target_ip }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_ip=$(jq -r .target_ip checks/request.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BUILDER_SSH_PRIVATE_KEY }}" > ~/.ssh/builder
          chmod 600 ~/.ssh/builder

      - name: Probe builder over SSH
        run: |
          ssh -i ~/.ssh/builder \
              -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 \
              "root@${{ steps.params.outputs.target_ip }}" <<'EOF'
          set -x
          hostname
          nixos-version
          nixos-version --configuration-revision || true
          systemctl is-active comin
          journalctl -u comin --no-pager -n 30 || true
          nix --version
          df -h / /nix 2>/dev/null || df -h /
          EOF

      - name: Probe nixremote build user (the ssh-ng:// path used by load tests)
        run: |
          ssh -i ~/.ssh/builder \
              -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=15 \
              "nixremote@${{ steps.params.outputs.target_ip }}" \
              'whoami && nix --version && nix store info --store daemon'
