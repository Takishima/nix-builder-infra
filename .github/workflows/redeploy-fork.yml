name: redeploy-fork

# Keeps the fleet tracking the Nix branch under test, end to end: when
# Takishima/nix's claude/single-branch-pr-split-xpy8oq branch moves, bump the
# flake.lock nix-fork pin, prebuild the fork's nix-cli AND the full system
# closure into Cachix, then push the lock bump to main. comin on each builder
# picks that up within ~60s and redeploys the cluster, substituting everything
# from the cache instead of compiling on a cx33 — without the system closure,
# nix-dependent packages (nixos-rebuild-ng and friends) rebuilt on-box and
# routinely blew post-deploy-verify's 20-minute convergence budget, costing a
# spurious auto-revert per bump.
#
# Triggers:
#   - repository_dispatch (type nix-fork-push): per-commit, sent by a tiny
#     notifier workflow in Takishima/nix (snippet in the README). Instant.
#   - workflow_dispatch for humans; push touching redeploy/request.json for
#     web sessions (whose scoped token cannot create dispatch events).
#
# The lock-bump commit is pushed with GITHUB_TOKEN, which GitHub never allows
# to trigger further workflows — no recursion, and the comin pull model does
# not depend on push events anyway.

on:
  repository_dispatch:
    types: [nix-fork-push]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["redeploy/request.json"]

permissions:
  contents: write
  # To dispatch post-deploy-verify for the lock bump (GITHUB_TOKEN pushes
  # never trigger push workflows on their own).
  actions: write

# Builds take a while; serialize runs so two bumps never race on main. A run
# queued behind a finished bump exits early at the changed=false check.
concurrency:
  group: redeploy-fork
  cancel-in-progress: false

env:
  FORK_REPO: Takishima/nix
  FORK_BRANCH: claude/single-branch-pr-split-xpy8oq

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # Always operate on the deploy branch tip, whatever event woke us up.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check whether the fork branch moved past the pin
        id: head
        run: |
          locked=$(jq -r '.nodes."nix-fork".locked.rev' flake.lock)
          head=$(git ls-remote "https://github.com/${FORK_REPO}.git" "refs/heads/${FORK_BRANCH}" | cut -f1)
          if [ -z "$head" ]; then
            echo "::error::branch ${FORK_BRANCH} not found on ${FORK_REPO}"
            exit 1
          fi
          echo "locked: $locked"
          echo "head:   $head"
          if [ "$head" = "$locked" ]; then
            echo "pin already at branch head; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1
        if: steps.head.outputs.changed == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Auth + cachix binary only. The result closure is pushed explicitly
      # below, BEFORE the lock bump lands on main, so comin never sees a pin
      # whose closure is not yet substitutable.
      - uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        if: steps.head.outputs.changed == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Bump the nix-fork pin to the branch head
        id: pin
        if: steps.head.outputs.changed == 'true'
        run: |
          nix flake update nix-fork
          rev=$(jq -r '.nodes."nix-fork".locked.rev' flake.lock)
          echo "new locked nix-fork rev: $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # Committed BEFORE the system build so the tree is clean and self.rev
      # matches what comin will evaluate. If main moves during the build the
      # later rebase rewrites the sha and only the configurationRevision-
      # dependent drvs (toplevel, nixos-version — seconds of on-box work)
      # miss the cache; every heavy path still substitutes.
      - name: Commit the lock bump
        if: steps.head.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          short=$(echo "${{ steps.pin.outputs.rev }}" | cut -c1-12)
          git commit -m "Bump nix-fork to ${short} (auto-redeploy)" flake.lock

      # nix-cli rather than #default (nix-everything) for the same reasons as
      # build-fork-nix.yml: it skips the functional-test suite and is the
      # package the builders run as nix.package.
      - name: Build the fork's nix-cli and push its closure to Cachix
        if: steps.head.outputs.changed == 'true'
        run: |
          nix build "github:${FORK_REPO}/${{ steps.pin.outputs.rev }}#nix-cli" \
            --print-build-logs --out-link result
          ./result/bin/nix --version
          cachix push "${{ vars.CACHIX_CACHE_NAME }}" "$(readlink -f result)"

      # Advisory: run the fork's functional suite and surface its result, but
      # do NOT block the bump on it. doCheck=true means building the attr runs
      # the suite — but the suite includes remote-build/ssh tests that need
      # loopback ssh the nix-build sandbox forbids, so a sandboxed
      # `nix build #nix-functional-tests` on a hosted runner fails on that
      # subset regardless of the rev's health (observed: nix-copy-ssh,
      # build-remote-* fail in <1s). It therefore cannot serve as a hard gate
      # here. The fleet's real pre-deploy protection is the on-builder
      # pre-switch coordinator smoke + post-deploy-verify (input build,
      # auto-revert), plus the hourly builder-protocol-tests against the live
      # daemon. A curated, sandbox-safe subset could become a hard gate later.
      - name: Run the fork's functional test suite (advisory)
        id: functests
        if: steps.head.outputs.changed == 'true'
        continue-on-error: true
        run: |
          nix build "github:${FORK_REPO}/${{ steps.pin.outputs.rev }}#nix-functional-tests" \
            --print-build-logs --no-link

      - name: Record the functional-suite result
        if: steps.head.outputs.changed == 'true'
        run: |
          if [ "${{ steps.functests.outcome }}" = "success" ]; then
            echo "fork functional suite: PASS for ${{ steps.pin.outputs.rev }}"
            echo "### functional suite: PASS (${{ steps.pin.outputs.rev }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::fork functional suite not green for ${{ steps.pin.outputs.rev }} (advisory; bump proceeds — deploy-time gates still apply)"
            {
              echo "### functional suite: NOT green (${{ steps.pin.outputs.rev }})"
              echo "Advisory only — the sandboxed suite cannot run the remote/ssh tests on a runner. The bump proceeds; the pre-switch coordinator smoke and post-deploy-verify auto-revert gate the actual deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The system closure contains nix-cli plus everything that depends on
      # it; with this in the cache a bump deploy converges in a couple of
      # minutes instead of compiling nix dependents on the builder. One host
      # suffices: the others differ only in hostname-derived leaves.
      - name: Build the full system closure and push it to Cachix
        if: steps.head.outputs.changed == 'true'
        run: |
          nix build \
            ".#nixosConfigurations.nix-builder-01.config.system.build.toplevel" \
            --print-build-logs --out-link system
          cachix push "${{ vars.CACHIX_CACHE_NAME }}" "$(readlink -f system)"

      # Only now is the new pin allowed onto the deploy branch. If a build
      # failed above, main keeps the old, working pin.
      - name: Push the lock bump to main (comin deploys it)
        if: steps.head.outputs.changed == 'true'
        run: |
          # main may have moved during the build; the lock bump rebases cleanly
          # over anything that did not itself touch flake.lock.
          git pull --rebase origin main
          git push origin main

      # GITHUB_TOKEN pushes never trigger push workflows, so the post-switch
      # verification (convergence + smoke build, with auto-revert) has to be
      # dispatched for the bump commit explicitly.
      - name: Dispatch post-deploy verification for the bump
        if: steps.head.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bump=$(git rev-parse HEAD)
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post-deploy-verify.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"sha\":\"$bump\"}}"
