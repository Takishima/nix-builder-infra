name: builder-protocol-tests

# Staged validation that a deployed Hetzner builder actually works as an
# ssh-ng:// remote builder running the patched Nix fork. A GH-hosted runner
# plays the client (the web sandbox has no outbound SSH) and offloads real
# builds via the build hook (--max-jobs 0 --builders "ssh-ng://nixremote@..."),
# exactly like the fork's own functional tests.
#
# Pipeline (each stage gates the next):
#   preflight          sanity-probe the builder daemon over SSH; hard-fails if
#                      the build-coordinator experimental feature is missing
#                      (the dedup stage cannot pass without it).
#   single-build       one fresh derivation (builtins.currentTime tag) builds
#                      remotely — once with a stock upstream client (old wire
#                      protocol) and once with the fork client (new protocol
#                      features negotiated in the handshake).
#   single-build-with-inputs
#                      same round-trip but the derivation has a real input
#                      closure (store-path build script + toFile source), so
#                      it fails if the builder sets up the sandbox without
#                      the inputs. Runs parallel to single-build and gates
#                      nothing: a red here must not hide the other stages'
#                      verdicts.
#   concurrent-builds  two *different* fresh derivations submitted at once over
#                      two ssh-ng sessions; asserts their executions overlapped
#                      on the builder, for both client flavours.
#   real-build         a genuine nixpkgs runCommand derivation (store-path
#                      bash builder, coreutils on PATH, builder substitutes
#                      the stdenv-ish closure itself) — the shape of every
#                      real-world build, run for both client flavours.
#                      Parallel to single-build; its verdict gates nothing,
#                      but the timing-sensitive stages wait for it to finish
#                      so its load cannot skew their assertions.
#   dedup              the new coordinator feature: one derivation is
#                      instantiated to a .drv first, then two clients (separate
#                      local stores, so client-side path locks cannot
#                      pre-coalesce them) build that same drv concurrently
#                      while it holds itself in-flight for ~30s. Asserts the
#                      builder ran ONE build: the late joiner sees the replayed
#                      MARKER log line, and both clients observe the same
#                      BUILDTOKEN. A third client arriving after completion
#                      must get a cheap cache hit, not a new execution.
#   failure-semantics  a deliberately failing build: the error and its log
#                      must propagate to the client; two clients racing the
#                      SAME failing drv must both receive the one failure
#                      (deduped failure); and a fresh build right after must
#                      succeed (failures must not poison the daemon).
#   client-abort       a client is SIGKILLed mid-build; a second client then
#                      builds the same drv and must succeed promptly, and the
#                      daemon must stay healthy for an unrelated build. Runs
#                      last: it is the stage most likely to wedge a buggy
#                      coordinator, and must not mask the other verdicts.
#
# Triggers: workflow_dispatch for humans; a push touching tests/request.json
# for web sessions (whose scoped token cannot create dispatch events). The
# push trigger reads its parameters from tests/request.json.

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: "Public IPv4 of the builder under test"
        required: true
      hold_seconds:
        description: "How long the dedup-stage build stays in-flight"
        required: false
        default: "30"
  push:
    branches: [main]
    paths: ["tests/request.json"]

permissions:
  contents: read

# Two pipeline runs against the fleet at once would only muddy the timing
# assertions; serialize them.
concurrency:
  group: builder-protocol-tests
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_ip: ${{ steps.params.outputs.target_ip }}
      hold_seconds: ${{ steps.params.outputs.hold_seconds }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_ip=${{ inputs.target_ip }}" >> "$GITHUB_OUTPUT"
            echo "hold_seconds=${{ inputs.hold_seconds }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_ip=$(jq -r .target_ip tests/request.json)" >> "$GITHUB_OUTPUT"
            echo "hold_seconds=$(jq -r '.hold_seconds // 30' tests/request.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BUILDER_SSH_PRIVATE_KEY }}" > ~/.ssh/builder
          chmod 600 ~/.ssh/builder

      - name: Probe the builder daemon
        run: |
          ip="${{ steps.params.outputs.target_ip }}"
          sshb() {
            ssh -i ~/.ssh/builder \
                -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=15 "$@"
          }
          sshb "root@$ip" 'hostname && nixos-version && nix --version && systemctl is-active nix-daemon.socket'
          sshb "nixremote@$ip" 'whoami && nix store info --store daemon'

          # The fleet should be running the locked fork pin; a mismatch usually
          # just means comin has not converged yet, so warn rather than fail —
          # the stages below test whatever daemon is actually deployed.
          locked=$(jq -r '.nodes."nix-fork".locked.rev' flake.lock | cut -c1-7)
          ver=$(sshb "root@$ip" 'nix --version')
          if ! echo "$ver" | grep -q "$locked"; then
            echo "::warning::builder runs '$ver' but flake.lock pins ${locked}; comin may still be converging"
          fi

      - name: Require the build-coordinator feature on the builder
        run: |
          ip="${{ steps.params.outputs.target_ip }}"
          feats=$(ssh -i ~/.ssh/builder \
                      -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
                      -o ConnectTimeout=15 \
                      "root@$ip" 'nix config show experimental-features')
          echo "builder experimental-features: $feats"
          case " $feats " in
            *" build-coordinator "*) echo "coordinator enabled" ;;
            *)
              echo "::error::the builder daemon does not have the build-coordinator experimental feature; the dedup stage cannot pass. Deploy the builder.nix that enables it (push to main, wait ~1 min for comin) and re-run."
              exit 1
              ;;
          esac

  # Stage 1: one fresh derivation, built remotely. The currentTime tag makes
  # the drv new on every run, so success proves the full protocol round-trip
  # (drv upload, scheduling, sandboxed build, log fan-in, output copy-back)
  # rather than a cache hit.
  single-build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client: [stock, fork]
    env:
      TARGET_IP: ${{ needs.preflight.outputs.target_ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protocol-client
        with:
          client: ${{ matrix.client }}
          target-ip: ${{ env.TARGET_IP }}
          ssh-private-key: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}

      - name: Build one fresh derivation on the remote builder
        run: |
          store="$RUNNER_TEMP/client-store"
          log="$RUNNER_TEMP/single.log"
          rc=0
          out=$(nix build -L --no-link --print-out-paths \
            --store "$store" --max-jobs 0 \
            --builders "ssh-ng://nixremote@$TARGET_IP x86_64-linux - 2 1" \
            -f tests/remote-build.nix \
            --argstr prefix "single-${{ matrix.client }}-${{ github.run_id }}" \
            2> "$log") || rc=$?
          sed 's/^/[build] /' "$log"
          [ "$rc" -eq 0 ] || { echo "::error::remote build failed"; exit "$rc"; }
          echo "built remotely: $out"
          # The output must have been copied back into the client store, and
          # the build log must have streamed over from the builder.
          nix path-info --store "$store" "$out"
          grep -q "MARKER:single-${{ matrix.client }}-" "$log" \
            || { echo "::error::build log never streamed back from the builder"; exit 1; }

  # Stage 1b: the regression probe for builds that arrive with a real input
  # closure. All the other probes are input-free (their builder is the
  # sandbox-provided /bin/sh), which is exactly why the pipeline stayed green
  # while every comin system rebuild on the same machine failed with
  # "executing '...-bash/bin/bash': No such file or directory" — a sandbox
  # missing its inputs is invisible to a derivation that has none. This probe
  # only succeeds if both input paths (the store-path build script and the
  # toFile source) were uploaded and bind-mounted into the sandbox.
  single-build-with-inputs:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client: [stock, fork]
    env:
      TARGET_IP: ${{ needs.preflight.outputs.target_ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protocol-client
        with:
          client: ${{ matrix.client }}
          target-ip: ${{ env.TARGET_IP }}
          ssh-private-key: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}

      - name: Build a derivation with a real input closure on the remote builder
        run: |
          store="$RUNNER_TEMP/client-store"
          log="$RUNNER_TEMP/with-inputs.log"
          rc=0
          out=$(nix build -L --no-link --print-out-paths \
            --store "$store" --max-jobs 0 \
            --builders "ssh-ng://nixremote@$TARGET_IP x86_64-linux - 2 1" \
            -f tests/remote-build-with-inputs.nix \
            --argstr prefix "inputs-${{ matrix.client }}-${{ github.run_id }}" \
            2> "$log") || rc=$?
          sed 's/^/[build] /' "$log"
          [ "$rc" -eq 0 ] || { echo "::error::remote build with a real input closure failed — sandbox likely missing the drv's inputs"; exit "$rc"; }
          echo "built remotely: $out"
          nix path-info --store "$store" "$out"
          grep -q "INPUT:inputs-${{ matrix.client }}-" "$log" \
            || { echo "::error::the toFile input's content never appeared in the build log"; exit 1; }

  # Stage 1c: a real nixpkgs derivation. runCommand means a store-path bash
  # as the builder and coreutils on PATH — the closure every real-world build
  # drags in, with builders-use-substitutes letting the builder fetch it from
  # cache.nixos.org instead of over the wire. First run on a fresh builder
  # downloads the closure (minutes); later runs are seconds.
  real-build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        client: [stock, fork]
    env:
      TARGET_IP: ${{ needs.preflight.outputs.target_ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protocol-client
        with:
          client: ${{ matrix.client }}
          target-ip: ${{ env.TARGET_IP }}
          ssh-private-key: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}

      - name: Build a real runCommand derivation on the remote builder
        run: |
          rev=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          tag="${{ matrix.client }}-${{ github.run_id }}-$(date +%s)"
          expr="import ./tests/real-build.nix { pkgs = import (builtins.fetchTarball \"https://github.com/NixOS/nixpkgs/archive/$rev.tar.gz\") {}; tag = \"$tag\"; }"
          store="$RUNNER_TEMP/client-store"
          log="$RUNNER_TEMP/real.log"
          rc=0
          out=$(nix build -L --no-link --print-out-paths --impure \
            --store "$store" --max-jobs 0 \
            --builders "ssh-ng://nixremote@$TARGET_IP x86_64-linux - 2 1" \
            --expr "$expr" \
            2> "$log") || rc=$?
          sed 's/^/[real] /' "$log"
          [ "$rc" -eq 0 ] || { echo "::error::real-world-shaped remote build failed"; exit "$rc"; }
          nix path-info --store "$store" "$out"
          grep -q "MARKER:real-$tag" "$log" \
            || { echo "::error::build log never streamed back"; exit 1; }
          grep -q "DONE:real-$tag" "$log" \
            || { echo "::error::build never ran to completion"; exit 1; }

  # Stage 2: two *different* fresh derivations submitted at the same time, each
  # holding itself in-flight, over two independent ssh-ng sessions. The
  # BUILDTOKEN lines carry the builder-side start clock, so the gap between
  # them proves the executions overlapped (a gap >= the hold time would mean
  # the builder serialized them).
  concurrent-builds:
    # Ordered after real-build (whose closure downloads and builds occupy the
    # 2-core builder's job slots and skew the timing assertion below) but not
    # gated on its verdict — hence the always() + explicit result checks.
    # max-parallel: 1 for the same reason: each matrix leg submits two builds
    # that must overlap, which needs both builder slots free.
    needs: [preflight, single-build, real-build]
    if: always() && needs.preflight.result == 'success' && needs.single-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        client: [stock, fork]
    env:
      TARGET_IP: ${{ needs.preflight.outputs.target_ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protocol-client
        with:
          client: ${{ matrix.client }}
          target-ip: ${{ env.TARGET_IP }}
          ssh-private-key: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}

      - name: Build two different derivations at once
        run: |
          hold=20
          # One local store per client process: two `nix build`s sharing a
          # store race on its SQLite db ("database is busy") before either
          # request reaches the builder. The builds must only be concurrent
          # builder-side, over their two ssh-ng sessions.
          build() { # $1 = index
            nix build -L --no-link \
              --store "$RUNNER_TEMP/client-store-$1" --max-jobs 0 \
              --builders "ssh-ng://nixremote@$TARGET_IP x86_64-linux - 2 1" \
              -f tests/remote-build.nix \
              --argstr prefix "pair$1-${{ matrix.client }}-${{ github.run_id }}" \
              --arg holdSeconds "$hold" \
              > "$RUNNER_TEMP/pair$1.log" 2>&1
          }
          build 1 & pid1=$!
          build 2 & pid2=$!
          rc1=0; rc2=0
          wait "$pid1" || rc1=$?
          wait "$pid2" || rc2=$?
          sed 's/^/[pair1] /' "$RUNNER_TEMP/pair1.log"
          sed 's/^/[pair2] /' "$RUNNER_TEMP/pair2.log"
          [ "$rc1" -eq 0 ] || { echo "::error::concurrent build 1 failed"; exit 1; }
          [ "$rc2" -eq 0 ] || { echo "::error::concurrent build 2 failed"; exit 1; }

          tok1=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$RUNNER_TEMP/pair1.log" | head -n1)
          tok2=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$RUNNER_TEMP/pair2.log" | head -n1)
          echo "builder-side start clocks: pair1=$tok1 pair2=$tok2 (hold=${hold}s)"
          [ -n "$tok1" ] && [ -n "$tok2" ] \
            || { echo "::error::missing BUILDTOKEN in a streamed log"; exit 1; }
          awk -v a="$tok1" -v b="$tok2" -v h="$hold" \
            'BEGIN { d = a > b ? a - b : b - a; exit !(d < h) }' \
            || { echo "::error::start times are >= ${hold}s apart: the builder serialized the two builds"; exit 1; }
          echo "the two builds overlapped on the builder"

  # Stage 3: the new coordinator feature. One derivation is evaluated to a .drv
  # up front (a shared epoch tag plays the builtins.currentTime role so both
  # client stores instantiate the byte-identical drv), then two clients build
  # that same drv concurrently while it holds itself in-flight. Distinct local
  # stores keep the client-side output path locks from coalescing the requests
  # before they ever reach the wire. Without the coordinator the second daemon
  # session would just block on the builder's path lock and return "already
  # valid" — no log ever reaches client B. With it, B attaches to the running
  # build: the pre-attach MARKER line is replayed to B, and both clients see
  # the same BUILDTOKEN, i.e. exactly one build ran.
  dedup:
    needs: [preflight, concurrent-builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_IP: ${{ needs.preflight.outputs.target_ip }}
      HOLD: ${{ needs.preflight.outputs.hold_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protocol-client
        with:
          client: fork
          target-ip: ${{ env.TARGET_IP }}
          ssh-private-key: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}

      - name: Evaluate the derivation once, then race two clients on it
        run: |
          storeA="$RUNNER_TEMP/store-A"
          storeB="$RUNNER_TEMP/store-B"
          logA="$RUNNER_TEMP/dedup-A.log"
          logB="$RUNNER_TEMP/dedup-B.log"
          builders="ssh-ng://nixremote@$TARGET_IP x86_64-linux - 2 1"
          tag="dedup-${{ github.run_id }}-$(date +%s)"

          # Evaluate first: both stores must hold the SAME .drv, so the
          # freshness tag is fixed once here instead of letting each
          # evaluation read its own builtins.currentTime.
          drvA=$(NIX_REMOTE="$storeA" nix-instantiate tests/remote-build.nix \
                   --argstr tag "$tag" --arg holdSeconds "$HOLD")
          drvB=$(NIX_REMOTE="$storeB" nix-instantiate tests/remote-build.nix \
                   --argstr tag "$tag" --arg holdSeconds "$HOLD")
          [ "$drvA" = "$drvB" ] \
            || { echo "::error::instantiation diverged: $drvA vs $drvB"; exit 1; }
          echo "derivation under test: $drvA (holds for ${HOLD}s)"

          build() { # $1 = local store, $2 = log file
            nix build -L --no-link \
              --store "$1" --max-jobs 0 \
              --builders "$builders" \
              "$drvA^*" > "$2" 2>&1
          }

          # Client A starts the (only) build; wait until its marker has
          # streamed back, i.e. the build is verifiably in-flight.
          build "$storeA" "$logA" & pidA=$!
          for _ in $(seq 1 120); do
            grep -q "MARKER:$tag" "$logA" && break
            kill -0 "$pidA" 2>/dev/null || break
            sleep 1
          done
          grep -q "MARKER:$tag" "$logA" \
            || { echo "::error::build A never streamed its marker"; sed 's/^/[A] /' "$logA"; exit 1; }

          # Client B requests the same drv while A's build is still holding.
          build "$storeB" "$logB" & pidB=$!

          # Informational: ask the coordinator what it is running right now
          # (should show our drv with 2 subscribers).
          sleep 5
          ssh -i ~/.ssh/builder "root@$TARGET_IP" \
            'nix --extra-experimental-features "nix-command build-coordinator" store active-builds' \
            || echo "::warning::active-builds probe failed (informational only)"

          rcA=0; rcB=0
          wait "$pidA" || rcA=$?
          wait "$pidB" || rcB=$?
          sed 's/^/[A] /' "$logA"
          sed 's/^/[B] /' "$logB"
          [ "$rcA" -eq 0 ] || { echo "::error::build A failed"; exit 1; }
          [ "$rcB" -eq 0 ] || { echo "::error::build B failed"; exit 1; }

          # Replay proof: the marker was emitted before B attached, so it can
          # only appear in B's log via the coordinator's buffered replay.
          grep -q "MARKER:$tag" "$logB" \
            || { echo "::error::late joiner never saw the replayed marker — the build was not deduped"; exit 1; }

          # Single-execution proof: same builder-side start clock on both ends.
          tokA=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$logA" | head -n1)
          tokB=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$logB" | head -n1)
          echo "token A=$tokA  token B=$tokB"
          [ -n "$tokA" ] || { echo "::error::no BUILDTOKEN in A's log"; exit 1; }
          [ "$tokA" = "$tokB" ] \
            || { echo "::error::tokens differ — two builds ran, no dedup"; exit 1; }
          echo "dedup OK: one build (token $tokA), two clients, late joiner got the replay"

          # A third client arriving AFTER completion must get the result
          # without a new execution: either silently (outputs substituted
          # from the builder) or via a replay of the one finished build —
          # never a fresh BUILDTOKEN.
          storeC="$RUNNER_TEMP/store-C"
          logC="$RUNNER_TEMP/dedup-C.log"
          drvC=$(NIX_REMOTE="$storeC" nix-instantiate tests/remote-build.nix \
                   --argstr tag "$tag" --arg holdSeconds "$HOLD")
          [ "$drvC" = "$drvA" ] || { echo "::error::client C instantiated a different drv"; exit 1; }
          start_c=$(date +%s)
          build "$storeC" "$logC" || { sed 's/^/[C] /' "$logC"; echo "::error::post-completion client failed"; exit 1; }
          took=$(( $(date +%s) - start_c ))
          sed 's/^/[C] /' "$logC"
          tokC=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$logC" | head -n1)
          if [ -n "$tokC" ] && [ "$tokC" != "$tokA" ]; then
            echo "::error::post-completion client triggered a NEW build (token $tokC != $tokA)"
            exit 1
          fi
          [ "$took" -lt $(( HOLD / 2 + 10 )) ] \
            || { echo "::error::post-completion client took ${took}s — looks like it rebuilt"; exit 1; }
          echo "post-completion client OK: cache hit in ${took}s (token: \"$tokC\")"

  # Stage 4: failure semantics. Real-world builds fail all the time; the
  # protocol must propagate the failure (exit status + streamed log), a
  # failing drv raced by two clients must produce ONE failed execution that
  # both observe, and the daemon must stay fully usable afterwards (failed
  # coordinator builds have wedged this fleet before).
  failure-semantics:
    needs: [preflight, dedup]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_IP: ${{ needs.preflight.outputs.target_ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protocol-client
        with:
          client: fork
          target-ip: ${{ env.TARGET_IP }}
          ssh-private-key: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}

      - name: A failing build must fail loudly, once, and leave the daemon healthy
        run: |
          builders="ssh-ng://nixremote@$TARGET_IP x86_64-linux - 2 1"

          # 1. Plain failure propagation.
          log="$RUNNER_TEMP/fail.log"
          rc=0
          nix build -L --no-link \
            --store "$RUNNER_TEMP/store-fail" --max-jobs 0 \
            --builders "$builders" \
            -f tests/remote-build.nix \
            --argstr prefix "fail-${{ github.run_id }}" --arg fail true \
            > "$log" 2>&1 || rc=$?
          sed 's/^/[fail] /' "$log"
          [ "$rc" -ne 0 ] || { echo "::error::a failing build reported success"; exit 1; }
          grep -q "MARKER:fail-" "$log" \
            || { echo "::error::failing build's log never streamed"; exit 1; }
          grep -q "FAILING:fail-" "$log" \
            || { echo "::error::the failure-side log line is missing"; exit 1; }

          # 2. Deduped failure: two clients race ONE failing drv (shared tag,
          # held in-flight). Both must fail, and the BUILDTOKENs they saw
          # must match: one execution, both subscribers told.
          tag="faildedup-${{ github.run_id }}-$(date +%s)"
          for c in A B; do
            NIX_REMOTE="$RUNNER_TEMP/fstore-$c" nix-instantiate tests/remote-build.nix \
              --argstr tag "$tag" --arg holdSeconds 15 --arg fail true > "$RUNNER_TEMP/fdrv-$c"
          done
          cmp -s "$RUNNER_TEMP/fdrv-A" "$RUNNER_TEMP/fdrv-B" \
            || { echo "::error::instantiation diverged"; exit 1; }
          drv=$(cat "$RUNNER_TEMP/fdrv-A")
          fbuild() { # $1 = store, $2 = log
            nix build -L --no-link \
              --store "$1" --max-jobs 0 --builders "$builders" \
              "$drv^*" > "$2" 2>&1
          }
          rcA=0; rcB=0
          fbuild "$RUNNER_TEMP/fstore-A" "$RUNNER_TEMP/flog-A" & pidA=$!
          for _ in $(seq 1 60); do
            grep -q "MARKER:$tag" "$RUNNER_TEMP/flog-A" && break
            kill -0 "$pidA" 2>/dev/null || break
            sleep 1
          done
          fbuild "$RUNNER_TEMP/fstore-B" "$RUNNER_TEMP/flog-B" & pidB=$!
          wait "$pidA" || rcA=$?
          wait "$pidB" || rcB=$?
          sed 's/^/[A] /' "$RUNNER_TEMP/flog-A"
          sed 's/^/[B] /' "$RUNNER_TEMP/flog-B"
          [ "$rcA" -ne 0 ] || { echo "::error::racing client A saw success on a failing drv"; exit 1; }
          [ "$rcB" -ne 0 ] || { echo "::error::racing client B saw success on a failing drv"; exit 1; }
          tokA=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$RUNNER_TEMP/flog-A" | head -n1)
          tokB=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$RUNNER_TEMP/flog-B" | head -n1)
          echo "failure tokens: A=$tokA B=$tokB"
          [ -n "$tokA" ] || { echo "::error::no token in A's failure log"; exit 1; }
          [ "$tokA" = "$tokB" ] \
            || { echo "::error::two executions of one failing drv (tokens differ) — failure was not deduped"; exit 1; }

          # 3. The daemon must be healthy immediately after.
          log="$RUNNER_TEMP/after.log"
          timeout 120 nix build -L --no-link \
            --store "$RUNNER_TEMP/store-after" --max-jobs 0 \
            --builders "$builders" \
            -f tests/remote-build.nix \
            --argstr prefix "afterfail-${{ github.run_id }}" \
            > "$log" 2>&1 \
            || { sed 's/^/[after] /' "$log"; echo "::error::daemon unhealthy after failed builds"; exit 1; }
          grep -q "DONE:afterfail-" "$log" \
            || { echo "::error::post-failure build did not stream its completion"; exit 1; }
          echo "failure semantics OK: propagated, deduped, daemon healthy"

  # Stage 5: client-abort resilience. Real clients get Ctrl-C'd, lose their
  # network, or are OOM-killed mid-build. Killing the owning client must not
  # strand the build or the coordinator: a second client building the same
  # drv must succeed promptly, and an unrelated build right after must too.
  # Deliberately the LAST stage — if a buggy coordinator wedges here, every
  # other verdict is already recorded.
  client-abort:
    needs: [preflight, failure-semantics]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_IP: ${{ needs.preflight.outputs.target_ip }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protocol-client
        with:
          client: fork
          target-ip: ${{ env.TARGET_IP }}
          ssh-private-key: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}

      - name: Kill a client mid-build; the drv and the daemon must survive
        run: |
          builders="ssh-ng://nixremote@$TARGET_IP x86_64-linux - 2 1"
          tag="abort-${{ github.run_id }}-$(date +%s)"
          for c in A B; do
            NIX_REMOTE="$RUNNER_TEMP/astore-$c" nix-instantiate tests/remote-build.nix \
              --argstr tag "$tag" --arg holdSeconds 40 > "$RUNNER_TEMP/adrv-$c"
          done
          drv=$(cat "$RUNNER_TEMP/adrv-A")
          [ "$drv" = "$(cat "$RUNNER_TEMP/adrv-B")" ] \
            || { echo "::error::instantiation diverged"; exit 1; }

          # Client A starts the build and is SIGKILLed once the build is
          # verifiably in flight on the builder.
          logA="$RUNNER_TEMP/abort-A.log"
          nix build -L --no-link \
            --store "$RUNNER_TEMP/astore-A" --max-jobs 0 --builders "$builders" \
            "$drv^*" > "$logA" 2>&1 & pidA=$!
          for _ in $(seq 1 60); do
            grep -q "MARKER:$tag" "$logA" && break
            kill -0 "$pidA" 2>/dev/null || break
            sleep 1
          done
          grep -q "MARKER:$tag" "$logA" \
            || { sed 's/^/[A] /' "$logA"; echo "::error::build A never got in flight"; exit 1; }
          tokA=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$logA" | head -n1)
          kill -9 "$pidA" 2>/dev/null || true
          wait "$pidA" 2>/dev/null || true
          echo "client A killed mid-build (token was $tokA)"
          sleep 3

          # Client B claims the same drv. Whether the coordinator adopted the
          # orphaned build (same token) or restarted it (new token) is
          # informational; B succeeding promptly is the requirement.
          logB="$RUNNER_TEMP/abort-B.log"
          timeout 180 nix build -L --no-link \
            --store "$RUNNER_TEMP/astore-B" --max-jobs 0 --builders "$builders" \
            "$drv^*" > "$logB" 2>&1 \
            || { sed 's/^/[B] /' "$logB"; echo "::error::second client could not finish the abandoned drv"; exit 1; }
          sed 's/^/[B] /' "$logB"
          tokB=$(sed -n 's/.*BUILDTOKEN:\([0-9.]*\).*/\1/p' "$logB" | head -n1)
          if [ -n "$tokB" ] && [ "$tokB" = "$tokA" ]; then
            echo "coordinator adopted the orphaned build (token $tokA)"
          else
            echo "::notice::build restarted after client death (A=$tokA B=$tokB) — acceptable, but adoption would be better"
          fi

          # Unrelated build right after: the daemon must not be wedged.
          log="$RUNNER_TEMP/afterabort.log"
          timeout 120 nix build -L --no-link \
            --store "$RUNNER_TEMP/astore-C" --max-jobs 0 --builders "$builders" \
            -f tests/remote-build.nix \
            --argstr prefix "afterabort-${{ github.run_id }}" \
            > "$log" 2>&1 \
            || { sed 's/^/[after] /' "$log"; echo "::error::daemon unhealthy after client abort"; exit 1; }
          echo "client-abort OK: drv recovered, daemon healthy"
