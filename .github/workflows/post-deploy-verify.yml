name: post-deploy-verify

# The post-switch half of the acceptance gates (the pre-switch half is
# system.preSwitchChecks in builder.nix). After a push to main, wait for
# comin to converge the builder to the pushed revision, then run a real
# input-bearing remote build over ssh-ng. If the deploy never converges or
# the smoke build fails, revert the commit on main: comin then rolls the
# fleet back to the last good revision (its closure is still in the store,
# so the rollback switch is immediate).
#
# Loop safety: the revert is pushed with GITHUB_TOKEN, which never triggers
# workflows — a failing revert cannot ping-pong. For the same reason the
# redeploy-fork lock bumps do not trigger this workflow on push; that
# workflow dispatches us explicitly instead.
#
# Known limitation: GITHUB_TOKEN may not modify .github/workflows/*, so a
# failing commit that itself touched workflow files cannot be auto-reverted
# (the push is rejected); the job fails loudly and the rollback is manual.
# Pre-switch checks still keep such a commit from ever activating on the
# fleet, so the blast radius is "main is red", not "the builder is broken".

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Revision the fleet should converge to (default: branch head)"
        required: false
      target_ip:
        description: "Builder IPv4 (default: tests/request.json)"
        required: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: post-deploy-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve parameters
        id: params
        run: |
          sha="${{ inputs.sha }}"
          [ -n "$sha" ] || sha="${{ github.sha }}"
          ip="${{ inputs.target_ip }}"
          [ -n "$ip" ] || ip=$(jq -r .target_ip tests/request.json)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "verifying deploy of $sha on $ip"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BUILDER_SSH_PRIVATE_KEY }}" > ~/.ssh/builder
          chmod 600 ~/.ssh/builder

      - name: Wait for comin to converge to the pushed revision
        run: |
          sha="${{ steps.params.outputs.sha }}"
          ip="${{ steps.params.outputs.ip }}"
          # 20 min: config-only commits converge in ~2, but a nix-fork pin
          # bump makes the builder download the whole new daemon closure
          # first — 10 min proved too short for that and caused two false
          # reverts of good bumps.
          for i in $(seq 1 80); do
            deployed=$(ssh -i ~/.ssh/builder \
                -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=15 "root@$ip" \
                'nixos-version --configuration-revision' 2>/dev/null || echo unreachable)
            echo "poll $i: deployed=$deployed"
            [ "$deployed" = "$sha" ] && { echo "converged"; exit 0; }
            sleep 15
          done
          echo "::error::builder never converged to $sha (deploy failed, or the pre-switch check refused it)"
          exit 1

      - uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Smoke-build a derivation with a real input closure on the builder
        run: |
          ip="${{ steps.params.outputs.ip }}"
          # ServerAlive* keepalives: a long-silent ssh-ng build emits no
          # bytes, and the runner's Azure egress reaps idle outbound TCP
          # after ~4 min, surfacing as "Nix daemon disconnected unexpectedly".
          export NIX_SSHOPTS="-i $HOME/.ssh/builder -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          log="$RUNNER_TEMP/postdeploy.log"

          # Coordinator state, captured over root SSH. Called WHILE the smoke
          # build hangs (the wedge is only observable then: lock holder,
          # listener and blocked daemon child all still exist) and again
          # post-mortem on failure.
          diagnose() {
            ssh -i ~/.ssh/builder \
                -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=15 "root@$ip" '
              echo "== coordinator files =="
              ls -la /nix/var/nix/coordinator* 2>&1 || true
              echo "== flock probe (0=winnable, 1=held) =="
              flock -n /nix/var/nix/coordinator.socket.lock true; echo "flock rc=$?"
              echo "== unix listeners =="
              ss -xlp 2>/dev/null | grep -i coordinator || echo "no coordinator listener"
              echo "== nix processes =="
              ps -eo pid,ppid,user,etime,wchan:30,args | grep -E "[n]ix" || true
              echo "== daemon/coordinator kernel stacks =="
              for p in $(pgrep -f "nix.*daemon|nix-daemon|build-coordinator" || true); do
                echo "-- pid $p comm=$(cat /proc/$p/comm 2>/dev/null) wchan=$(cat /proc/$p/wchan 2>/dev/null)"
                cat /proc/$p/stack 2>/dev/null || true
              done
            ' 2>&1 | sed "s/^/[$1] /" || true
          }

          nix build -L --no-link \
            --store "$RUNNER_TEMP/client-store" --max-jobs 0 \
            --builders "ssh-ng://nixremote@$ip x86_64-linux - 2 1" \
            -f tests/remote-build-with-inputs.nix \
            --argstr prefix "postdeploy-${{ github.run_id }}" \
            2> "$log" &
          build_pid=$!
          start=$(date +%s)
          rc=0
          captured=0
          # Healthy smokes finish in well under 2 min; past that we are in
          # the wedge window (attach timeout + relay death takes minutes),
          # so grab the builder state while the hang is live. Hard cap at
          # 8 min: the historical wedge never recovers on its own.
          while kill -0 "$build_pid" 2>/dev/null; do
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -ge 120 ] && [ "$captured" -eq 0 ]; then
              captured=1
              echo "::warning::smoke build still running after ${elapsed}s; capturing coordinator state mid-hang"
              diagnose wedge
            fi
            if [ "$elapsed" -ge 480 ]; then
              echo "::error::smoke build wedged for ${elapsed}s; killing it"
              kill "$build_pid" 2>/dev/null || true
              break
            fi
            sleep 5
          done
          wait "$build_pid" || rc=$?
          elapsed=$(( $(date +%s) - start ))
          echo "smoke build: rc=$rc after ${elapsed}s"
          sed 's/^/[smoke] /' "$log"
          if [ "$rc" -ne 0 ]; then
            [ "$captured" -eq 1 ] || diagnose post-mortem
            echo "::error::post-deploy smoke build failed (rc=$rc after ${elapsed}s)"
            exit 1
          fi
          grep -q "INPUT:postdeploy-" "$log" \
            || { echo "::error::input content never streamed back"; exit 1; }
          echo "post-deploy verification passed"

      - name: Revert the commit on failure
        if: failure()
        run: |
          sha="${{ steps.params.outputs.sha }}"
          ip="${{ steps.params.outputs.ip }}"
          head=$(git rev-parse origin/main)
          if [ "$head" != "$sha" ]; then
            echo "::warning::main has moved past $sha; leaving the revert to the newer run"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "$sha" \
            || { echo "::error::cannot revert $sha automatically (conflict); manual rollback needed"; exit 1; }
          git push origin main
          echo "reverted $sha on main; waiting for the fleet to roll back"
          back=$(git rev-parse HEAD)
          for i in $(seq 1 20); do
            deployed=$(ssh -i ~/.ssh/builder \
                -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=15 "root@$ip" \
                'nixos-version --configuration-revision' 2>/dev/null || echo unreachable)
            echo "rollback poll $i: deployed=$deployed (want $back)"
            [ "$deployed" = "$back" ] && { echo "fleet rolled back"; exit 0; }
            sleep 15
          done
          echo "::warning::rollback commit pushed but convergence not yet observed"
