name: bootstrap-builder

# One-shot bootstrap of a Hetzner builder VM: installs
# nixosConfigurations.<host> onto a fresh server with nixos-anywhere
# (kexec + disko). Runs on a GitHub-hosted runner because the Claude Code web
# sandbox has no outbound SSH. After this completes once, all further config
# deploys happen via comin (GitOps pull) — see README.md.

# Two triggers: workflow_dispatch for humans, and a push touching
# bootstrap/request.json for Claude Code web sessions, whose scoped token can
# push contents but cannot create dispatch events.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "Flake host to install (nixosConfigurations.<host>)"
        required: true
        default: nix-builder-01
      target_ip:
        description: "Public IPv4 of the target server (root must authorize BUILDER_SSH_PRIVATE_KEY)"
        required: true
  push:
    branches: [main]
    paths: ["bootstrap/request.json"]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve host and target IP
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "host=${{ inputs.host }}" >> "$GITHUB_OUTPUT"
            echo "target_ip=${{ inputs.target_ip }}" >> "$GITHUB_OUTPUT"
          else
            echo "host=$(jq -r .host bootstrap/request.json)" >> "$GITHUB_OUTPUT"
            echo "target_ip=$(jq -r .target_ip bootstrap/request.json)" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BUILDER_SSH_PRIVATE_KEY }}" > ~/.ssh/builder
          chmod 600 ~/.ssh/builder

      - name: Install NixOS with nixos-anywhere
        run: |
          nix run github:nix-community/nixos-anywhere -- \
            --flake ".#${{ steps.params.outputs.host }}" \
            -i ~/.ssh/builder \
            --ssh-option StrictHostKeyChecking=accept-new \
            "root@${{ steps.params.outputs.target_ip }}"

      - name: Wait for reboot and verify
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/builder -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=10 "root@${{ steps.params.outputs.target_ip }}" \
                 'nixos-version && systemctl is-active comin && nix --version'; then
              echo "builder is up and comin is active"
              exit 0
            fi
            echo "not up yet (attempt $i); retrying in 10s"
            sleep 10
          done
          echo "builder did not come back up" >&2
          exit 1
